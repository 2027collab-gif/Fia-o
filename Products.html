<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FIA'O - Inventory</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="Products.css">
</head>

<body>

    <!-- =========================
         TOP NAVIGATION
    ========================== -->

    <header class="topbar">

        <a href="#" class="brand">
            <img src="assets/fiao-logo.svg" alt="FIA'O Logo">
        </a>

        <nav class="main-nav">

            <a href="#" data-i18n="navHome">
                Home
            </a>

            <a href="#" data-i18n="navCredit">
                Credit
            </a>

            <a href="#" data-i18n="navProducts">
                Products
            </a>

            <a href="#" data-i18n="navClients">
                Clients
            </a>

            <a href="#" data-i18n="navReports">
                Reports
            </a>

            <a href="#" data-i18n="navContact">
                Contact
            </a>

        </nav>

    </header>


    <!-- =========================
         SEARCH / OPTIONS BAR
    ========================== -->

    <section class="utility-bar">

        <div class="utility-brand">

            <img
                src="assets/fiao-logo.svg"
                alt="FIA'O">

        </div>


        <div class="search-box">

            <span class="search-icon">
                ⌕
            </span>

            <input
                id="searchInput"
                type="search"
                placeholder="Search products, pantry, drinks..."
                data-i18n-placeholder="searchPlaceholder">

        </div>


        <div class="utility-actions">

            <!-- LANGUAGE -->

            <button
                class="language-btn"
                id="languageBtn"
                type="button">

                <span>
                    ◉
                </span>

                <strong id="languageLabel">
                    ES
                </strong>

            </button>


            <!-- DARK MODE -->

            <button
                class="theme-btn"
                id="themeBtn"
                type="button">

                <span id="themeIcon">
                    ☾
                </span>

            </button>

        </div>

    </section>


    <!-- =========================
         MAIN CONTENT
    ========================== -->

    <main class="page">


        <!-- TABS -->

        <div class="section-tabs">

            <button
                class="tab active"
                id="inventoryTab"
                data-i18n="inventory">

                Inventory

            </button>


            <button
                class="tab"
                id="saleTab"
                data-i18n="registerSale">

                Register Fiado Sale

            </button>

        </div>


        <!-- =========================
             INVENTORY
        ========================== -->

        <section id="inventoryView">

            <div class="intro">

                <h1 data-i18n="inventoryTitle">
                    Your inventory, always exact
                </h1>

                <p data-i18n="inventorySubtitle">
                    Showing core products and add option.
                    Use search bar to look up items.
                </p>

            </div>


            <!-- PRODUCTS WILL APPEAR HERE -->

            <div
                class="product-grid"
                id="productGrid">
            </div>

        </section>


        <!-- =========================
             REGISTER FIADO SALE
        ========================== -->

        <section
            id="saleView"
            class="sale-view hidden">

            <div class="sale-card">

                <h2 data-i18n="saleTitle">
                    Register Fiado Sale
                </h2>

                <p data-i18n="saleText">
                    Select a client and add the products sold on credit.
                </p>


                <div class="sale-form">

                    <label>

                        <span data-i18n="client">
                            Client
                        </span>

                        <input
                            id="clientName"
                            type="text"
                            placeholder="Client name">

                    </label>


                    <label>

                        <span data-i18n="saleProduct">
                            Product
                        </span>

                        <select id="saleProduct"></select>

                    </label>


                    <label>

                        <span data-i18n="quantity">
                            Quantity
                        </span>

                        <input
                            id="saleQuantity"
                            type="number"
                            min="1"
                            value="1">

                    </label>


                    <button
                        id="registerSaleBtn"
                        class="primary-btn"
                        type="button"
                        data-i18n="register">

                        Register

                    </button>

                </div>


                <p
                    id="saleMessage"
                    class="sale-message">
                </p>

            </div>

        </section>

    </main>


    <!-- =========================
         ADD / EDIT PRODUCT MODAL
    ========================== -->

    <div
        class="modal-backdrop hidden"
        id="productModal">

        <div class="modal">

            <button
                class="close-btn"
                id="closeModal"
                type="button">

                ×

            </button>


            <h2
                id="modalTitle"
                data-i18n="addProduct">

                Add New Product

            </h2>


            <form id="productForm">

                <input
                    type="hidden"
                    id="editingId">


                <label>

                    <span data-i18n="productName">
                        Product name
                    </span>

                    <input
                        id="productName"
                        required
                        type="text"
                        placeholder="Example: Flour">

                </label>


                <label>

                    <span data-i18n="category">
                        Category
                    </span>

                    <select id="productCategory">

                        <option>
                            Pantry
                        </option>

                        <option>
                            Bakery
                        </option>

                        <option>
                            Beverages
                        </option>

                        <option>
                            Dairy
                        </option>

                        <option>
                            Other
                        </option>

                    </select>

                </label>


                <label>

                    <span data-i18n="price">
                        Price (B/.)
                    </span>

                    <input
                        id="productPrice"
                        required
                        type="number"
                        min="0"
                        step="0.01"
                        placeholder="1.50">

                </label>


                <label>

                    <span data-i18n="stock">
                        Stock
                    </span>

                    <input
                        id="productStock"
                        required
                        type="number"
                        min="0"
                        step="1"
                        placeholder="10">

                </label>


                <label>

                    <span data-i18n="unit">
                        Unit
                    </span>

                    <input
                        id="productUnit"
                        required
                        type="text"
                        value="Unit"
                        placeholder="Unit / Bottle / Pack / lb">

                </label>


                <div class="modal-actions">

                    <button
                        class="cancel-btn"
                        id="cancelModal"
                        type="button"
                        data-i18n="cancel">

                        Cancel

                    </button>


                    <button
                        class="primary-btn"
                        type="submit"
                        data-i18n="save">

                        Save product

                    </button>

                </div>

            </form>

        </div>

    </div>


    <!-- TOAST -->

    <div
        class="toast"
        id="toast">
    </div>


    <!-- JAVASCRIPT -->

    <script src="Products.js"></script>

</body>
</html>
